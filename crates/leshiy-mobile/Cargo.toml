[package]
name = "leshiy-mobile"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "leshiy_mobile"

# In-repo bindgen so Kotlin/Swift generation uses the exact pinned uniffi version.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
leshiy-client = { path = "../leshiy-client" }
leshiy-tun = { path = "../leshiy-tun" }
leshiy-reality = { path = "../leshiy-reality" }
leshiy-provision = { path = "../leshiy-provision" }
tokio = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
blake2 = "0.10"
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }

[dev-dependencies]
async-trait = { workspace = true }
# `start_paused` virtual time; `test-util` is not part of the workspace feature set.
tokio = { workspace = true, features = ["test-util"] }
